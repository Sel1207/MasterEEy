<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101312">
  <meta name="description" content="A focused set of trigonometric identity flashcards.">
  <title>Identity Practice | Math Flashcards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
  <style>
    :root {
      color-scheme: dark;
      --page: #101312;
      --surface: #171b19;
      --surface-raised: #1d2320;
      --line: #303934;
      --text: #f0f1e9;
      --muted: #9aa49d;
      --lime: #c8f169;
      --lime-ink: #171b12;
      --coral: #ff8f75;
      --mono: "DM Mono", monospace;
      --sans: "DM Sans", sans-serif;
      --serif: "Instrument Serif", Georgia, serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background-color: var(--page);
      background-image: radial-gradient(ellipse at 50% 44%, #252c2717 0, transparent 58%),
        linear-gradient(90deg, transparent 49.95%, #ffffff08 50%, transparent 50.05%);
      font-family: var(--sans);
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app-shell {
      width: min(100% - 48px, 860px);
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      min-height: 78px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      animation: enter 500ms ease both;
    }

    .wordmark {
      display: flex;
      gap: 11px;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .wordmark-mark {
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      border: 1px solid #637344;
      border-radius: 50%;
      color: var(--lime);
      font-family: var(--serif);
      font-size: 19px;
      line-height: 1;
    }

    .session-label, .eyebrow, .card-index, .round-label {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .session-label { color: var(--muted); }

    .header-actions { display: flex; align-items: center; gap: 15px; }
    .study-open { min-height: 38px; padding: 0 12px; font-size: 12px; }

    main {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 55px 0 48px;
      animation: enter 650ms 80ms ease both;
    }

    .intro {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 24px;
    }

    .eyebrow { margin: 0 0 10px; color: var(--lime); }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(36px, 6vw, 54px);
      font-weight: 400;
      line-height: 0.98;
      letter-spacing: 0;
    }

    .round-label { padding-bottom: 5px; color: var(--muted); white-space: nowrap; }
    .round-label span { color: var(--text); }

    .card-stage {
      width: 100%;
      height: 330px;
      perspective: 1200px;
    }

    .flashcard {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 650ms cubic-bezier(.2,.7,.2,1);
    }

    .flashcard.is-revealed { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-face::before, .card-face::after {
      position: absolute;
      width: 18px;
      height: 18px;
      content: "";
      border-color: #71824f;
      border-style: solid;
      opacity: .7;
    }

    .card-face::before { top: 15px; left: 15px; border-width: 1px 0 0 1px; }
    .card-face::after { right: 15px; bottom: 15px; border-width: 0 1px 1px 0; }
    .card-back { transform: rotateY(180deg); background: var(--surface-raised); }

    .card-index { position: absolute; top: 23px; color: var(--muted); }

    .card-prompt {
      max-width: 650px;
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(30px, 5vw, 48px);
      font-weight: 400;
      line-height: 1.14;
      text-align: center;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .card-hint {
      position: absolute;
      bottom: 23px;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .answer-math {
      max-width: 100%;
      color: var(--lime);
      font-size: clamp(22px, 4vw, 36px);
      text-align: center;
      overflow-wrap: anywhere;
    }

    .answer-math .katex-display { margin: 0; }
    .card-prompt .katex-display { margin: 0; }
    .answer-caption { position: absolute; bottom: 23px; margin: 0; color: var(--muted); font-size: 12px; }

    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
    }

    .button {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 17px;
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
      transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .button:hover { transform: translateY(-1px); }
    .button:active { transform: translateY(0); }
    .button:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
    .button-primary { color: var(--lime-ink); background: var(--lime); }
    .button-primary:hover { background: #d5f58d; }
    .button-secondary { border-color: var(--line); color: var(--text); background: transparent; }
    .button-secondary:hover { border-color: #768078; background: #ffffff08; }

    .next-button { min-height: 38px; padding: 0 11px; font-size: 12px; }
    .next-button span { font-size: 16px; line-height: 1; }

    .button:disabled { cursor: default; opacity: .7; transform: none; }

    .study-dialog {
      width: min(820px, calc(100% - 28px));
      max-width: none;
      max-height: min(84vh, 840px);
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--text);
      background: var(--surface);
    }

    .study-dialog::backdrop { background: #070908d9; backdrop-filter: blur(4px); }
    .study-window { max-height: min(84vh, 840px); display: flex; flex-direction: column; }

    .study-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 21px 25px;
      border-bottom: 1px solid var(--line);
    }

    .study-title { margin: 0; font-family: var(--serif); font-size: 32px; font-weight: 400; line-height: 1; }
    .study-count { margin: 0 0 7px; color: var(--lime); font-family: var(--mono); font-size: 10px; text-transform: uppercase; }
    .study-close { min-height: 36px; padding: 0 12px; font-size: 12px; }

    .study-content { overflow-y: auto; padding: 20px 25px 26px; overscroll-behavior: contain; }
    .study-group + .study-group { margin-top: 21px; padding-top: 18px; border-top: 1px solid var(--line); }
    .study-group-title { margin: 0 0 7px; color: var(--lime); font-family: var(--mono); font-size: 10px; font-weight: 400; text-transform: uppercase; }
    .study-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 25px; margin: 0; padding: 0; list-style: none; }
    .study-item { min-width: 0; padding: 12px 0; overflow-x: auto; border-bottom: 1px solid #30393499; }
    .study-equation { display: flex; align-items: baseline; gap: 7px; min-width: max-content; font-size: 15px; line-height: 1.6; }
    .study-equals { color: var(--lime); }
    .study-prompt { margin: 0 0 7px; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .study-answer { color: var(--lime); font-size: 15px; }

    footer {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
    }

    .footer-dot { display: inline-block; width: 6px; height: 6px; margin-right: 8px; border-radius: 50%; background: var(--lime); }

    @keyframes enter {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .app-shell { width: min(100% - 32px, 480px); }
      .topbar { min-height: 66px; }
      .session-label { font-size: 9px; }
      .header-actions { gap: 0; }
      .header-actions .session-label { display: none; }
      .study-open { min-height: 36px; padding: 0 10px; }
      main { padding: 39px 0 32px; }
      .intro { align-items: start; flex-direction: column; gap: 13px; margin-bottom: 18px; }
      .card-stage { height: 300px; }
      .card-face { padding: 30px 22px; }
      .card-actions { margin-top: 17px; }
      .study-header { padding: 17px 18px; }
      .study-content { padding: 15px 18px 20px; }
      .study-list { grid-template-columns: 1fr; }
      footer { min-height: 52px; font-size: 9px; }
    }

    @media (max-width: 370px) {
      .app-shell { width: calc(100% - 24px); }
      .wordmark { font-size: 12px; }
      .card-stage { height: 280px; }
      .card-prompt { font-size: 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="wordmark"><span class="wordmark-mark" aria-hidden="true">&#8721;</span><span>Math, by memory</span></div>
      <div class="header-actions">
        <span class="session-label">TRIG / CALCULUS / SET 01</span>
        <button class="button button-secondary study-open" id="study-open" type="button">Study sheet</button>
      </div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">A little practice goes a long way</p>
          <h1 id="page-title">Identity practice</h1>
        </div>
        <div class="round-label">ROUND <span id="round-count">01</span></div>
      </section>

      <section class="card-stage" aria-label="Flashcard">
        <div class="flashcard" id="flashcard">
          <article class="card-face card-front" aria-live="polite">
            <span class="card-index">PROMPT / <span id="card-number">01</span></span>
            <p class="card-prompt" id="question"></p>
            <p class="card-hint">Work out the right-hand side, then reveal to check</p>
          </article>
          <article class="card-face card-back" aria-live="polite" aria-hidden="true">
            <span class="card-index">IDENTITY / <span id="answer-number">01</span></span>
            <div class="answer-math" id="answer"></div>
            <p class="answer-caption">Take a moment to commit it to memory</p>
          </article>
        </div>
      </section>

      <div class="card-actions" aria-label="Flashcard controls">
        <button class="button button-primary" id="reveal-button" type="button">Reveal answer</button>
        <button class="button button-secondary next-button" id="next-card" type="button">Next card <span aria-hidden="true">&#8594;</span></button>
      </div>
    </main>

    <footer>
      <span><i class="footer-dot" aria-hidden="true"></i>58 IDENTITIES</span>
      <span>ONE CARD AT A TIME</span>
    </footer>
  </div>

  <dialog class="study-dialog" id="study-dialog" aria-labelledby="study-title">
    <div class="study-window">
      <header class="study-header">
        <div>
          <p class="study-count">REFERENCE / 58 FORMULAS</p>
          <h2 class="study-title" id="study-title">Study sheet</h2>
        </div>
        <button class="button button-secondary study-close" id="study-close" type="button">Close</button>
      </header>
      <div class="study-content" id="study-content"></div>
    </div>
  </dialog>

  <script>
    const identities = [
      {
        question: "What is the Pythagorean identity for sine and cosine?",
        answer: String.raw`\sin^2(x) + \cos^2(x) = 1`
      },
      {
        question: "What is the double-angle identity for sine?",
        answer: String.raw`\sin(2x) = 2\sin(x)\cos(x)`
      },
      {
        question: "What is the double-angle identity for cosine, written with cosine squared?",
        answer: String.raw`\cos(2x) = 2\cos^2(x) - 1`
      },
      {
        question: "What is the double-angle identity for cosine, written with sine squared?",
        answer: String.raw`\cos(2x) = 1 - 2\sin^2(x)`
      },
      {
        question: "What is the power-reduction identity for sine squared?",
        answer: String.raw`\sin^2(x) = \frac{1 - \cos(2x)}{2}`
      },
      {
        question: "What is the power-reduction identity for cosine squared?",
        answer: String.raw`\cos^2(x) = \frac{1 + \cos(2x)}{2}`
      },
      {
        question: "What is the Pythagorean identity involving tangent and secant?",
        answer: String.raw`1 + \tan^2(x) = \sec^2(x)`
      },
      {
        question: "What is the double-angle identity for tangent?",
        answer: String.raw`\tan(2x) = \frac{2\tan(x)}{1 - \tan^2(x)}`
      }
    ];

    const newIdentities = [
      { category: "Pythagorean identities", question: String.raw`\sec^2(x) - \tan^2(x)`, answer: String.raw`1` },
      { category: "Pythagorean identities", question: String.raw`\csc^2(x) - \cot^2(x)`, answer: String.raw`1` },
      { category: "Pythagorean identities", question: String.raw`1 + \cot^2(x)`, answer: String.raw`\csc^2(x)` },

      { category: "Reciprocal and quotient identities", question: String.raw`\sec(x)`, answer: String.raw`\frac{1}{\cos(x)}` },
      { category: "Reciprocal and quotient identities", question: String.raw`\csc(x)`, answer: String.raw`\frac{1}{\sin(x)}` },
      { category: "Reciprocal and quotient identities", question: String.raw`\cot(x)`, answer: String.raw`\frac{1}{\tan(x)}` },
      { category: "Reciprocal and quotient identities", question: String.raw`\tan(x)`, answer: String.raw`\frac{\sin(x)}{\cos(x)}` },
      { category: "Reciprocal and quotient identities", question: String.raw`\cot(x)`, answer: String.raw`\frac{\cos(x)}{\sin(x)}` },
      { category: "Reciprocal and quotient identities", question: String.raw`\sin(x)\csc(x)`, answer: String.raw`1` },
      { category: "Reciprocal and quotient identities", question: String.raw`\cos(x)\sec(x)`, answer: String.raw`1` },
      { category: "Reciprocal and quotient identities", question: String.raw`\tan(x)\cot(x)`, answer: String.raw`1` },

      { category: "Double-angle formulas", question: String.raw`\sin(2x)`, answer: String.raw`\frac{2\tan(x)}{1 + \tan^2(x)}` },
      { category: "Double-angle formulas", question: String.raw`\cos(2x)`, answer: String.raw`\frac{1 - \tan^2(x)}{1 + \tan^2(x)}` },
      { category: "Double-angle formulas", question: String.raw`\cot(2x)`, answer: String.raw`\frac{\cot^2(x) - 1}{2\cot(x)}` },
      { category: "Double-angle formulas", question: String.raw`\sec(2x)`, answer: String.raw`\frac{\sec^2(x)}{2 - \sec^2(x)}` },
      { category: "Double-angle formulas", question: String.raw`\csc(2x)`, answer: String.raw`\frac{1}{2\sin(x)\cos(x)}` },

      { category: "Half-angle formulas", question: String.raw`\sin\left(\frac{x}{2}\right)`, answer: String.raw`\pm\sqrt{\frac{1 - \cos(x)}{2}}` },
      { category: "Half-angle formulas", question: String.raw`\cos\left(\frac{x}{2}\right)`, answer: String.raw`\pm\sqrt{\frac{1 + \cos(x)}{2}}` },
      { category: "Half-angle formulas", question: String.raw`\tan\left(\frac{x}{2}\right)`, answer: String.raw`\pm\sqrt{\frac{1 - \cos(x)}{1 + \cos(x)}}` },
      { category: "Half-angle formulas", question: String.raw`\tan\left(\frac{x}{2}\right)`, answer: String.raw`\frac{\sin(x)}{1 + \cos(x)}` },
      { category: "Half-angle formulas", question: String.raw`\tan\left(\frac{x}{2}\right)`, answer: String.raw`\frac{1 - \cos(x)}{\sin(x)}` },

      { category: "Sum and difference formulas", question: String.raw`\sin(a + b)`, answer: String.raw`\sin(a)\cos(b) + \cos(a)\sin(b)` },
      { category: "Sum and difference formulas", question: String.raw`\sin(a - b)`, answer: String.raw`\sin(a)\cos(b) - \cos(a)\sin(b)` },
      { category: "Sum and difference formulas", question: String.raw`\cos(a + b)`, answer: String.raw`\cos(a)\cos(b) - \sin(a)\sin(b)` },
      { category: "Sum and difference formulas", question: String.raw`\cos(a - b)`, answer: String.raw`\cos(a)\cos(b) + \sin(a)\sin(b)` },
      { category: "Sum and difference formulas", question: String.raw`\tan(a + b)`, answer: String.raw`\frac{\tan(a) + \tan(b)}{1 - \tan(a)\tan(b)}` },
      { category: "Sum and difference formulas", question: String.raw`\tan(a - b)`, answer: String.raw`\frac{\tan(a) - \tan(b)}{1 + \tan(a)\tan(b)}` },
      { category: "Sum and difference formulas", question: String.raw`\sin(a) + \sin(b)`, answer: String.raw`2\sin\left(\frac{a + b}{2}\right)\cos\left(\frac{a - b}{2}\right)` },
      { category: "Sum and difference formulas", question: String.raw`\sin(a) - \sin(b)`, answer: String.raw`2\cos\left(\frac{a + b}{2}\right)\sin\left(\frac{a - b}{2}\right)` },
      { category: "Sum and difference formulas", question: String.raw`\cos(a) + \cos(b)`, answer: String.raw`2\cos\left(\frac{a + b}{2}\right)\cos\left(\frac{a - b}{2}\right)` },
      { category: "Sum and difference formulas", question: String.raw`\cos(a) - \cos(b)`, answer: String.raw`-2\sin\left(\frac{a + b}{2}\right)\sin\left(\frac{a - b}{2}\right)` },

      { category: "Derivative rules", question: String.raw`\frac{d}{dx}C`, answer: String.raw`0` },
      { category: "Derivative rules", question: String.raw`\frac{d}{dx}x^n`, answer: String.raw`nx^{n - 1}` },
      { category: "Derivative rules", question: String.raw`\frac{d}{dx}\sin(x)`, answer: String.raw`\cos(x)` },
      { category: "Derivative rules", question: String.raw`\frac{d}{dx}\cos(x)`, answer: String.raw`-\sin(x)` },
      { category: "Derivative rules", question: String.raw`\frac{d}{dx}\tan(x)`, answer: String.raw`\sec^2(x)` },
      { category: "Derivative rules", question: String.raw`\frac{d}{dx}\cot(x)`, answer: String.raw`-\csc^2(x)` },
      { category: "Derivative rules", question: String.raw`\frac{d}{dx}\sec(x)`, answer: String.raw`\sec(x)\tan(x)` },
      { category: "Derivative rules", question: String.raw`\frac{d}{dx}\csc(x)`, answer: String.raw`-\csc(x)\cot(x)` },
      { category: "Derivative rules", question: String.raw`\frac{d}{dx}e^x`, answer: String.raw`e^x` },
      { category: "Derivative rules", question: String.raw`\frac{d}{dx}\ln|x|`, answer: String.raw`\frac{1}{x}` },

      { category: "Integral rules", question: String.raw`\int x^n\,dx,\quad n \ne -1`, answer: String.raw`\frac{x^{n + 1}}{n + 1} + C` },
      { category: "Integral rules", question: String.raw`\int \frac{1}{x}\,dx`, answer: String.raw`\ln|x| + C` },
      { category: "Integral rules", question: String.raw`\int e^x\,dx`, answer: String.raw`e^x + C` },
      { category: "Integral rules", question: String.raw`\int \sin(x)\,dx`, answer: String.raw`-\cos(x) + C` },
      { category: "Integral rules", question: String.raw`\int \cos(x)\,dx`, answer: String.raw`\sin(x) + C` },
      { category: "Integral rules", question: String.raw`\int \sec^2(x)\,dx`, answer: String.raw`\tan(x) + C` },
      { category: "Integral rules", question: String.raw`\int \csc^2(x)\,dx`, answer: String.raw`-\cot(x) + C` },
      { category: "Integral rules", question: String.raw`\int \sec(x)\tan(x)\,dx`, answer: String.raw`\sec(x) + C` },
      { category: "Integral rules", question: String.raw`\int \frac{1}{1 + x^2}\,dx`, answer: String.raw`\arctan(x) + C` }
    ];

    identities.push(...newIdentities);

    let currentIndex = -1;
    let round = 0;
    const flashcard = document.getElementById("flashcard");
    const front = document.querySelector(".card-front");
    const back = document.querySelector(".card-back");
    const revealButton = document.getElementById("reveal-button");

    function loadCard() {
      let nextIndex = Math.floor(Math.random() * identities.length);
      if (identities.length > 1 && nextIndex === currentIndex) {
        nextIndex = (nextIndex + 1 + Math.floor(Math.random() * (identities.length - 1))) % identities.length;
      }
      currentIndex = nextIndex;
      round += 1;
      const currentIdentity = identities[currentIndex];
      const questionElement = document.getElementById("question");
      if (currentIdentity.category && window.katex) {
        katex.render(currentIdentity.question, questionElement, { displayMode: true, throwOnError: false });
      } else {
        questionElement.textContent = currentIdentity.question;
      }
      const answerElement = document.getElementById("answer");
      if (window.katex) {
        katex.render(currentIdentity.answer, answerElement, { displayMode: true, throwOnError: false });
      } else {
        answerElement.textContent = currentIdentity.answer;
      }
      document.getElementById("card-number").textContent = String(currentIndex + 1).padStart(2, "0");
      document.getElementById("answer-number").textContent = String(currentIndex + 1).padStart(2, "0");
      document.getElementById("round-count").textContent = String(round).padStart(2, "0");
      flashcard.classList.remove("is-revealed");
      back.setAttribute("aria-hidden", "true");
      front.setAttribute("aria-hidden", "false");
      revealButton.disabled = false;
      revealButton.textContent = "Reveal answer";
    }

    function revealCard() {
      flashcard.classList.add("is-revealed");
      back.setAttribute("aria-hidden", "false");
      front.setAttribute("aria-hidden", "true");
      revealButton.textContent = "Answer revealed";
      revealButton.disabled = true;
    }

    revealButton.addEventListener("click", revealCard);
    document.getElementById("next-card").addEventListener("click", loadCard);

    const studyDialog = document.getElementById("study-dialog");
    document.getElementById("study-open").addEventListener("click", () => {
      const studyContent = document.getElementById("study-content");
      studyContent.replaceChildren();
      const categories = [
        { title: "Core flashcards", entries: identities.filter((identity) => !identity.category) },
        ...Array.from(new Set(newIdentities.map((identity) => identity.category))).map((title) => ({
          title,
          entries: identities.filter((identity) => identity.category === title)
        }))
      ];

      categories.forEach(({ title, entries }) => {
        const section = document.createElement("section");
        section.className = "study-group";
        const heading = document.createElement("h3");
        heading.className = "study-group-title";
        heading.textContent = title;
        const list = document.createElement("ul");
        list.className = "study-list";

        entries.forEach((identity) => {
          const item = document.createElement("li");
          item.className = "study-item";
          if (identity.category) {
            const equation = document.createElement("div");
            equation.className = "study-equation";
            const left = document.createElement("span");
            const equals = document.createElement("span");
            equals.className = "study-equals";
            equals.textContent = "=";
            const right = document.createElement("span");
            if (window.katex) {
              katex.render(identity.question, left, { throwOnError: false });
              katex.render(identity.answer, right, { throwOnError: false });
            } else {
              left.textContent = identity.question;
              right.textContent = identity.answer;
            }
            equation.append(left, equals, right);
            item.append(equation);
          } else {
            const prompt = document.createElement("p");
            prompt.className = "study-prompt";
            prompt.textContent = identity.question;
            const answer = document.createElement("div");
            answer.className = "study-answer";
            if (window.katex) {
              katex.render(identity.answer, answer, { throwOnError: false });
            } else {
              answer.textContent = identity.answer;
            }
            item.append(prompt, answer);
          }
          list.append(item);
        });

        section.append(heading, list);
        studyContent.append(section);
      });

      studyDialog.showModal();
    });

    document.getElementById("study-close").addEventListener("click", () => studyDialog.close());
    studyDialog.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        event.preventDefault();
        studyDialog.close();
      }
    });
    studyDialog.addEventListener("click", (event) => {
      if (event.target === studyDialog) studyDialog.close();
    });
    document.addEventListener("DOMContentLoaded", loadCard, { once: true });
  </script>
</body>
</html>
